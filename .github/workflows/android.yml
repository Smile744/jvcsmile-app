name: Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          # Si tu proyecto está en la raíz y tiene gradlew:
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          # Si tu proyecto Android está dentro de ./app/ y tiene gradlew allí:
          elif [ -f "./app/gradlew" ]; then
            chmod +x ./app/gradlew
            ./app/gradlew assembleDebug --no-daemon
          else
            echo "No se encontró gradlew. Revisa si tu proyecto Android está en la raíz o en un subdirectorio."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jvcsmile-launcher
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/debug/*.apk
